name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Laravel) — Lint, Migrate, Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lawfirm_test
          POSTGRES_USER: lawfirm
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lawfirm -d lawfirm_test"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, pgsql, redis, bcmath, intl, zip, pcntl
          coverage: xdebug
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        run: ./vendor/bin/pint --test

      - name: Run migrations against PostgreSQL
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: lawfirm_test
          DB_USERNAME: lawfirm
          DB_PASSWORD: secret
        run: php artisan migrate --force

      - name: Run tests with coverage
        run: php artisan test --coverage --min=0

      # B5 · M7-A: يُثبت السلوك الحسّاس على PostgreSQL الحقيقي (نفس محرّك الإنتاج) — ما لا تغطّيه
      # المجموعة الرئيسيّة (SQLite). قاعدة pgsql مُهاجَرة سلفاً في خطوة «migrate against PostgreSQL».
      # الاختبار يتخطّى نفسه على غير pgsql؛ هنا نُجبِر الاتصال بـ Postgres فيعمل فعليّاً.
      - name: Integration tests on PostgreSQL (audit trigger + jsonb)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: lawfirm_test
          DB_USERNAME: lawfirm
          DB_PASSWORD: secret
        run: php artisan test tests/Integration/AuditLogTriggerTest.php

  security:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
