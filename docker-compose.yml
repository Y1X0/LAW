# LawFirm ERP — بيئة التطوير (Docker Compose)
# الخدمات: تطبيق Laravel (php-fpm) + Nginx + PostgreSQL 16 + Redis 7
# الاستخدام: cp backend/.env.example backend/.env ثم: docker compose up -d

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lawfirm_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    env_file:
      - ./backend/.env
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - lawfirm

  nginx:
    image: nginx:1.27-alpine
    container_name: lawfirm_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - lawfirm

  pgsql:
    image: postgres:16-alpine
    container_name: lawfirm_pgsql
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-lawfirm}
      POSTGRES_USER: ${DB_USERNAME:-lawfirm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-lawfirm} -d ${DB_DATABASE:-lawfirm}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lawfirm

  redis:
    image: redis:7-alpine
    container_name: lawfirm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - lawfirm

networks:
  lawfirm:
    driver: bridge

volumes:
  pgdata:
  redisdata:
