# نشر LawFirm ERP على Render — Blueprint (Infrastructure as Code).
# ثلاث خدمات: API (Docker: nginx+php-fpm) · واجهة (Static) · Postgres.
# لا ميزات ولا منطق — تشغيل فقط. راجع docs/DEPLOY-RENDER.md.
#
# ملاحظات قرار (بنيت على بنية المشروع الحالية):
#  - الخدمة تستخدم Dockerfile القائم + إعداد nginx القائم (nginx+php-fpm في صورة واحدة).
#  - المحرّكات database/sync لتجنّب اشتراط Redis/عامل منفصل في v1.0 (يمكن الترقية لاحقاً).
#  - القيم sync:false تُضبط يدوياً في لوحة Render (أسرار/عناوين تُعرف بعد الإنشاء).

databases:
  - name: law-postgres
    databaseName: lawfirm
    user: lawfirm
    plan: free # ارفعها إلى starter للإنتاج الفعلي

services:
  # ---------- الخلفية (Laravel API) ----------
  - type: web
    name: law-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: sh docker/render/start.sh # يخدم HTTP على $PORT (nginx+fpm)
    healthCheckPath: /up
    # الهجرات + بذر الأدوار تُنفَّذ عند إقلاع الحاوية داخل start.sh (idempotent)، لأن
    # الخطة المجانية في Render لا تدعم preDeployCommand. عند الترقية لخطة مدفوعة يمكن
    # نقلها إلى preDeployCommand لتشغيلها مرّة قبل تبديل الإصدار بدل كل إقلاع.
    envVars:
      - key: APP_KEY # أنشئه: php artisan key:generate --show ثم الصقه
        sync: false
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL # عنوان هذه الخدمة بعد الإنشاء (https://law-api-xxx.onrender.com)
        sync: false
      - key: LOG_CHANNEL
        value: stderr # سجلّات إلى تيار Render (القرص مؤقّت)
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase: { name: law-postgres, property: host }
      - key: DB_PORT
        fromDatabase: { name: law-postgres, property: port }
      - key: DB_DATABASE
        fromDatabase: { name: law-postgres, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: law-postgres, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: law-postgres, property: password }
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: sync # تشغيل المهام ضمن الطلب (لا حاجة لعامل منفصل في v1.0)
      - key: FILESYSTEM_DISK
        value: local
      # مستندات القضايا على Cloudflare R2 (Phase 5). القرص "r2" في config/filesystems.
      - key: LEGAL_DOCUMENTS_DISK
        value: r2
      - key: R2_DEFAULT_REGION
        value: auto
      # القيم الحسّاسة (sync:false) تُضبط كأسرار في لوحة Render بعد إنشاء دلو R2 ومفاتيحه.
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: FRONTEND_URL # عنوان الواجهة — يحصر CORS (اختياري لكن مُوصى به)
        sync: false
      # أوّل مالك منصّة (B4): يُنشأ تلقائيّاً عند الإقلاع من هذين السرّين (DatabaseSeeder،
      # idempotent). المسار الرسمي لأوّل مدير — لا حاجة لـ tinker. دوِّر كلمة المرور بعد أوّل دخول.
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      # البريد (SMTP — Phase 13 · B2). لتفعيل الإرسال الحقيقي (استعادة كلمة المرور): اضبط
      # MAIL_MAILER=smtp + الأسرار أدناه في لوحة Render. إن تُرك MAIL_MAILER فارغاً يعود
      # افتراضيّاً إلى log (لا إرسال) فلا يتعطّل شيء قبل ضبط SMTP. راجع docs/DEPLOY-RENDER.md.
      - key: MAIL_MAILER
        sync: false # = smtp في الإنتاج (فارغ ⇒ log)
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SCHEME
        sync: false # smtp أو smtps حسب المزوّد
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        sync: false

  # ---------- المُجدوِل الموحّد (Cron — B3) ----------
  # خدمة cron واحدة تشغّل مُجدوِل Laravel كل دقيقة (`php artisan schedule:run`) على نفس صورة
  # الـ backend (بلا nginx/هجرات — dockerCommand مخصّص يتخطّى start.sh). كل المواعيد مُعرَّفة في
  # backend/routes/console.php (مصدر واحد): التذكيرات يوميّاً 06:00، والنسخ الاحتياطي يوميّاً 03:00.
  # إضافة مهمة مستقبلاً = سطر في console.php لا تعديل هنا. كل الأوامر idempotent ومانعة للتكرار.
  # لذا تحمل الخدمة أسرار MAIL_* (بريد التذكيرات) و R2_BACKUP_* (النسخ) معاً. ملاحظة: خدمات cron
  # في Render تتطلّب خطة مدفوعة (ليست free). بديل تشغيلي: خدمة worker تشغّل `schedule:work` دائماً
  # (تتفادى إقلاع حاوية كل دقيقة) — راجع docs/DEPLOY-RENDER.md. مزامنة البصمة Pull **غير مُجدوَلة**
  # هنا (معطّلة افتراضياً؛ تحتاج مُشغّلاً داخل شبكة المكتب — راجع console.php والتوثيق).
  - type: cron
    name: law-scheduler
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    schedule: "* * * * *" # كل دقيقة — Laravel يقرّر ما يستحقّ التشغيل
    dockerCommand: php artisan schedule:run
    envVars:
      - key: APP_KEY # نفس مفتاح law-api
        sync: false
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase: { name: law-postgres, property: host }
      - key: DB_PORT
        fromDatabase: { name: law-postgres, property: port }
      - key: DB_DATABASE
        fromDatabase: { name: law-postgres, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: law-postgres, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: law-postgres, property: password }
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local
      # بريد التذكيرات (SMTP — B2). فارغ ⇒ log (لا إرسال) فلا يتعطّل شيء قبل الضبط.
      - key: MAIL_MAILER
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SCHEME
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        sync: false
      # دلو R2 منفصل للنسخ (غير دلو الوثائق) — تُضبط أسراره في لوحة Render.
      - key: R2_BACKUP_DEFAULT_REGION
        value: auto
      - key: R2_BACKUP_ACCESS_KEY_ID
        sync: false
      - key: R2_BACKUP_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BACKUP_BUCKET
        sync: false
      - key: R2_BACKUP_ENDPOINT
        sync: false

  # ---------- الواجهة (React/Vite SPA — استضافة ثابتة) ----------
  - type: web
    name: law-web
    runtime: static
    buildCommand: "cd frontend && npm ci && npm run build"
    staticPublishPath: ./frontend/dist
    # تحويل مسارات SPA (تحديث /admin/users لا يعطي 404).
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL # وقت البناء: https://<law-api-domain>/api
        sync: false
