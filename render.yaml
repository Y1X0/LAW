# نشر LawFirm ERP على Render — Blueprint (Infrastructure as Code).
# ثلاث خدمات: API (Docker: nginx+php-fpm) · واجهة (Static) · Postgres.
# لا ميزات ولا منطق — تشغيل فقط. راجع docs/DEPLOY-RENDER.md.
#
# ملاحظات قرار (بنيت على بنية المشروع الحالية):
#  - الخدمة تستخدم Dockerfile القائم + إعداد nginx القائم (nginx+php-fpm في صورة واحدة).
#  - المحرّكات database/sync لتجنّب اشتراط Redis/عامل منفصل في v1.0 (يمكن الترقية لاحقاً).
#  - القيم sync:false تُضبط يدوياً في لوحة Render (أسرار/عناوين تُعرف بعد الإنشاء).

databases:
  - name: law-postgres
    databaseName: lawfirm
    user: lawfirm
    plan: free # ارفعها إلى starter للإنتاج الفعلي

services:
  # ---------- الخلفية (Laravel API) ----------
  - type: web
    name: law-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: sh docker/render/start.sh # يخدم HTTP على $PORT (nginx+fpm)
    healthCheckPath: /up
    # الهجرات + بذر الأدوار تُنفَّذ عند إقلاع الحاوية داخل start.sh (idempotent)، لأن
    # الخطة المجانية في Render لا تدعم preDeployCommand. عند الترقية لخطة مدفوعة يمكن
    # نقلها إلى preDeployCommand لتشغيلها مرّة قبل تبديل الإصدار بدل كل إقلاع.
    envVars:
      - key: APP_KEY # أنشئه: php artisan key:generate --show ثم الصقه
        sync: false
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL # عنوان هذه الخدمة بعد الإنشاء (https://law-api-xxx.onrender.com)
        sync: false
      - key: LOG_CHANNEL
        value: stderr # سجلّات إلى تيار Render (القرص مؤقّت)
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase: { name: law-postgres, property: host }
      - key: DB_PORT
        fromDatabase: { name: law-postgres, property: port }
      - key: DB_DATABASE
        fromDatabase: { name: law-postgres, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: law-postgres, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: law-postgres, property: password }
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: sync # تشغيل المهام ضمن الطلب (لا حاجة لعامل منفصل في v1.0)
      - key: FILESYSTEM_DISK
        value: local
      # مستندات القضايا على Cloudflare R2 (Phase 5). القرص "r2" في config/filesystems.
      - key: LEGAL_DOCUMENTS_DISK
        value: r2
      - key: R2_DEFAULT_REGION
        value: auto
      # القيم الحسّاسة (sync:false) تُضبط كأسرار في لوحة Render بعد إنشاء دلو R2 ومفاتيحه.
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: FRONTEND_URL # عنوان الواجهة — يحصر CORS (اختياري لكن مُوصى به)
        sync: false
      - key: MAIL_MAILER
        value: log # بدّلها إلى smtp + بيانات SMTP لتفعيل بريد إعادة كلمة المرور

  # ---------- التذكيرات المجدولة (Cron — Phase 8) ----------
  # يشغّل أمر التذكيرات يوميّاً على نفس صورة الـ backend (بلا nginx/هجرات — يتخطّى start.sh
  # عبر dockerCommand مخصّص). الأمر idempotent ومانع تكرار، فالتشغيل اليومي آمن. لا R2/بريد
  # (التذكيرات داخل النظام فقط). ملاحظة: خدمات cron في Render تتطلّب خطة مدفوعة (ليست free).
  - type: cron
    name: law-reminders
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    schedule: "0 6 * * *" # يوميّاً 06:00 UTC
    dockerCommand: php artisan notifications:remind
    envVars:
      - key: APP_KEY # نفس مفتاح law-api
        sync: false
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase: { name: law-postgres, property: host }
      - key: DB_PORT
        fromDatabase: { name: law-postgres, property: port }
      - key: DB_DATABASE
        fromDatabase: { name: law-postgres, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: law-postgres, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: law-postgres, property: password }
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync

  # ---------- النسخ الاحتياطي اليومي (Cron — Phase 13) ----------
  # يشغّل backup:run يوميّاً على نفس صورة الـ backend. pg_dump مثبَّت في الصورة. النسخ ترفع إلى
  # دلو R2 منفصل (R2_BACKUP_*). النوع يُشتقّ من التاريخ (GFS)، والاحتفاظ يُقلَّم تلقائياً. ملاحظة:
  # خدمات cron في Render تتطلّب خطة مدفوعة. الاستعادة ليست هنا — تُجرى يدويّاً عبر backup:restore.
  - type: cron
    name: law-backup
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    schedule: "0 3 * * *" # يوميّاً 03:00 UTC
    dockerCommand: php artisan backup:run
    envVars:
      - key: APP_KEY # نفس مفتاح law-api
        sync: false
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase: { name: law-postgres, property: host }
      - key: DB_PORT
        fromDatabase: { name: law-postgres, property: port }
      - key: DB_DATABASE
        fromDatabase: { name: law-postgres, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: law-postgres, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: law-postgres, property: password }
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local
      # دلو R2 منفصل للنسخ (غير دلو الوثائق) — تُضبط أسراره في لوحة Render.
      - key: R2_BACKUP_DEFAULT_REGION
        value: auto
      - key: R2_BACKUP_ACCESS_KEY_ID
        sync: false
      - key: R2_BACKUP_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BACKUP_BUCKET
        sync: false
      - key: R2_BACKUP_ENDPOINT
        sync: false

  # ---------- الواجهة (React/Vite SPA — استضافة ثابتة) ----------
  - type: web
    name: law-web
    runtime: static
    buildCommand: "cd frontend && npm ci && npm run build"
    staticPublishPath: ./frontend/dist
    # تحويل مسارات SPA (تحديث /admin/users لا يعطي 404).
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL # وقت البناء: https://<law-api-domain>/api
        sync: false
